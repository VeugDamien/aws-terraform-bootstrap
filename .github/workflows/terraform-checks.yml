# Static checks on every pull request and push to main. No AWS access: safe
# for pull requests from forks too.
#   - terraform fmt and validate on every environment
#   - tflint (rules in .tflint.hcl)
#   - trivy security scan of the Terraform code and the bootstrap stack
#     (fails on HIGH and CRITICAL; accepted findings in .trivyignore.yaml)
# Tools are pinned by version and verified with their SHA-256 checksum.
name: terraform-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Terraform version
        id: version
        run: echo "terraform=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      # Every folder under environments/ (active or not) and every module.
      - name: Validate
        run: |
          status=0
          for dir in environments/*/ modules/*/; do
            echo "::group::${dir}"
            if ! (cd "${dir}" && terraform init -backend=false -input=false >/dev/null && terraform validate -no-color); then
              echo "::error::terraform validate failed in ${dir}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tflint
        env:
          TFLINT_VERSION: 0.65.0
          TFLINT_SHA256: d4c545ed2e29d6338604b586f34f544f380f70f243aa72f7b484713835eaec61
        run: |
          curl -sSfL -o tflint.zip \
            "${GITHUB_SERVER_URL}/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint.zip" | sha256sum --check --strict
          unzip -q tflint.zip tflint && sudo install -m 0755 tflint /usr/local/bin/tflint && rm -f tflint.zip tflint

      - name: Install plugins
        env:
          # Only used to download the pinned plugins without rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Lint
        run: tflint --recursive --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact

  security:
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install trivy
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "${archive}" \
            "${GITHUB_SERVER_URL}/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" trivy && sudo install -m 0755 trivy /usr/local/bin/trivy && rm -f "${archive}" trivy

      - name: Scan Terraform and CloudFormation
        run: |
          trivy config --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml .
