# Terraform plan on pull requests, one job per affected environment.
# An environment is a folder environments/<name>/ with a ci.json: add a folder
# and it is picked up automatically. Plans are posted as one PR comment.
# Third-party actions are pinned by full commit SHA (version in the comment).
name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  detect:
    name: Detect environments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Pull requests from forks never get AWS credentials.
    # Never switch this workflow to pull_request_target.
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
      terraform-version: ${{ steps.detect.outputs.terraform-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "environments=$(.github/scripts/environments.sh "${BASE}" HEAD)" >> "${GITHUB_OUTPUT}"
          echo "terraform-version=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_OUTPUT}"

  plan:
    name: Plan ${{ matrix.environment }}
    needs: detect
    if: needs.detect.outputs.environments != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read ci.json
        id: ci
        run: |
          echo "region=$(jq -er .aws_region ci.json)" >> "${GITHUB_OUTPUT}"
          echo "role=$(jq -er .plan_role_arn ci.json)" >> "${GITHUB_OUTPUT}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci.outputs.role }}
          aws-region: ${{ steps.ci.outputs.region }}
          role-session-name: terraform-plan

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ needs.detect.outputs.terraform-version }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive ../..

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > "${RUNNER_TEMP}/${ENVIRONMENT}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.environment }}
          path: ${{ runner.temp }}/${{ matrix.environment }}.txt
          retention-days: 7

  # One comment for all environments. This job never has AWS credentials.
  comment:
    name: Comment plans
    needs: plan
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-*
          merge-multiple: true
          path: plans

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const files = fs.readdirSync('plans').filter((f) => f.endsWith('.txt')).sort();
            const budget = Math.floor(60000 / Math.max(files.length, 1));
            let body = `${marker}\n### Terraform plan\n`;
            for (const f of files) {
              let plan = fs.readFileSync(`plans/${f}`, 'utf8');
              if (plan.length > budget) plan = plan.slice(0, budget) + '\n... (truncated, see the artifacts)';
              const summary = (plan.match(/^Plan: .*$|^No changes\..*$/m) || ['see details'])[0];
              body += `\n<details><summary><b>${f.replace('.txt', '')}</b>: ${summary}</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>\n`;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
